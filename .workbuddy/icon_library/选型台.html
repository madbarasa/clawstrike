<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>图标选型台 · 815 张 CC0 图标</title>
<style>
:root{--bg:#14171f;--card:#1e222c;--line:#2f3542;--txt:#e8eaed;--dim:#8b93a3;--gold:#f0be3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(20,23,31,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
h1{margin:0 0 4px;font-size:17px;color:var(--gold)}
.sub{color:var(--dim);font-size:12px}
.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px;background:#0f1219;border:1px solid var(--line);
  color:var(--txt);padding:7px 11px;border-radius:7px;font-size:13px;outline:none}
input[type=search]:focus{border-color:var(--gold)}
.tab{padding:5px 11px;background:#252a36;border:1px solid var(--line);color:var(--dim);
  border-radius:6px;font-size:12px;cursor:pointer;user-select:none}
.tab.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
#sel{background:#0f1219;border:1px solid var(--line);color:var(--txt);
  padding:7px 11px;border-radius:7px;font-size:12px;font-family:monospace;
  min-width:200px;flex:1}
button.act{background:var(--gold);color:#1a1408;border:none;padding:7px 14px;
  border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
section{padding:16px 20px 40px}
h2{font-size:14px;margin:20px 0 10px;color:var(--gold);
  border-left:3px solid var(--gold);padding-left:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:9px 5px;text-align:center;cursor:pointer;transition:.11s;user-select:none}
.cell:hover{border-color:var(--gold);background:#262b37;transform:translateY(-2px)}
.cell.pick{border-color:var(--gold);background:#2d2718;box-shadow:0 0 0 1px var(--gold) inset}
.cell img{width:38px;height:38px;display:block;margin:0 auto 5px;
  filter:brightness(1.6) saturate(.35)}
.cell .n{font-size:10px;color:var(--dim);word-break:break-all;line-height:1.25;
  font-family:monospace}
.cell.pick .n{color:var(--gold)}
.hint{color:var(--dim);font-size:12px;margin:10px 0 0}
</style></head><body>
<header>
  <h1>德州扑克 · 图标选型台</h1>
  <div class="sub">共 815 张 · 来源 game-icon-pack（CC0 1.0 免署名可商用）· 点击卡片选中，右上角复制名单</div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索图标名，如 skull / crown / fire / trophy...">
    <span class="tab on" data-c="all">全部</span>
  </div>
  <div class="toolbar" style="margin-top:8px">
    <div id="sel">（未选中）</div>
    <button class="act" id="copy">复制选中名单</button>
    <button class="act" id="clr" style="background:#3a4150;color:#ddd">清空</button>
  </div>
</header>

const picked = new Set();
const body = document.getElementById('body');
const selBox = document.getElementById('sel');
function render(filter, cat){
  let h = '';
  for(const c of DATA){
    if(cat !== 'all' && c.id !== cat) continue;
    const items = c.items.filter(i => !filter || i.name.toLowerCase().includes(filter));
    if(!items.length) continue;
    h += '<h2>' + c.cn + ' <span style="color:#666;font-size:11px">(' + c.id + ')</span> · ' + items.length + ' 个</h2><div class="grid">';
    for(const i of items){
      const key = i.name;
      h += '<div class="cell' + (picked.has(key)?' pick':'') + '" data-n="' + key + '">'
         + '<img src="' + i.file + '" alt=""><div class="n">' + i.name + '</div></div>';
    }
    h += '</div>';
  }
  body.innerHTML = h || '<p class="hint">没有匹配的图标。</p>';
  body.querySelectorAll('.cell').forEach(el => {
    el.onclick = () => {
      const n = el.dataset.n;
      if(picked.has(n)) picked.delete(n); else picked.add(n);
      el.classList.toggle('pick');
      updSel();
    };
  });
}
function updSel(){
  selBox.textContent = picked.size ? [...picked].join(', ') : '（未选中）';
}
document.getElementById('q').oninput = e =>
  render(e.target.value.trim().toLowerCase(), document.querySelector('.tab.on').dataset.c);
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    render(document.getElementById('q').value.trim().toLowerCase(), t.dataset.c);
  };
});
document.getElementById('copy').onclick = () => {
  const txt = [...picked].join(', ');
  navigator.clipboard.writeText(txt).then(
    () => { selBox.textContent = '✔ 已复制：' + txt; },
    () => { selBox.textContent = txt; });
};
document.getElementById('clr').onclick = () => {
  picked.clear();
  render(document.getElementById('q').value.trim().toLowerCase(),
         document.querySelector('.tab.on').dataset.c);
  updSel();
};
render('', 'all');
</script></body></html>
